name: Build Cobre TV

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar APK de depuração
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/cobre-tv-gradle.log"
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            details=$(tail -n 45 "$RUNNER_TEMP/cobre-tv-gradle.log")
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Cobre TV Gradle failure::$details"
            exit "$build_status"
          fi
      - name: Guardar APK de depuração
        uses: actions/upload-artifact@v4
        with:
          name: Cobre-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
